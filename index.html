<!doctype html>
<!-- Объявление типа документа: сообщает браузеру, что используется стандарт HTML5 -->
<html lang="ru">
  <!-- Открытие корневого тега с указанием русского языка для поисковиков и экранных дикторов -->
  <head>
    <!-- Начало служебного раздела страницы (метаданные, ссылки на стили) -->
    <meta charset="UTF-8" />
    <!-- Установка кодировки UTF-8 для корректного отображения кириллицы -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Настройка области просмотра для корректного масштабирования на мобильных устройствах -->
    <title>Практическая работа №8 — Сетевые запросы и асинхронность</title>
    <!-- Заголовок страницы, который отображается на вкладке браузера -->
    <link rel="stylesheet" href="style.css" />
    <!-- Подключение внешнего файла каскадных таблиц стилей (CSS) -->
  </head>
  <!-- Закрытие служебного раздела head -->
  <body>
    <!-- Начало тела документа: здесь находится всё, что видит пользователь -->
    <header class="header">
      <!-- Шапка сайта: вводная часть страницы с заголовком -->
      <h1>GitHub Spy — Поиск разработчиков</h1>
      <!-- Главный заголовок первого уровня с названием приложения -->
    </header>
    <!-- Закрытие шапки сайта -->
    <main class="main-content">
      <!-- Основной блок страницы, содержащий уникальный контент приложения -->
      <!-- Форма поиска -->
      <!-- Комментарий в коде: начало блока для ввода данных пользователем -->
      <section id="search-section" class="section">
        <!-- Секция, объединяющая элементы формы поиска -->
        <form id="search-form">
          <!-- Форма для сбора данных; id нужен для перехвата события submit в JS -->
          <input
            type="text"
            id="username"
            placeholder="Введите GitHub username"
            required
          />
          <!-- Поле ввода текста с подсказкой и обязательным заполнением -->
          <button type="submit" id="searchBtn">Найти</button>
          <!-- Кнопка отправки формы, запускающая процесс поиска в GitHub -->
        </form>
        <!-- Закрытие тега формы -->
        <div id="error" class="error hidden"></div>
        <!-- Пустой блок для вывода ошибок; класс hidden скрывает его до появления ошибки -->
      </section>
      <!-- Конец секции поиска -->
      <!-- Loader -->
      <!-- Комментарий в коде: блок индикации процесса загрузки данных -->
      <div class="loader hidden" id="loader">Загрузка...</div>
      <!-- Элемент, который показывается пользователю во время ожидания ответа от API -->
      <!-- Профиль -->
      <!-- Комментарий в коде: начало блока отображения информации о пользователе -->
      <section id="profile-section" class="section hidden">
        <!-- Секция профиля; изначально скрыта (hidden) до успешного запроса -->
        <div id="profile" class="profile-card">
          <!-- Контейнер-карточка, куда JS будет динамически вставлять данные (аватар, имя, био) -->
          <!-- Здесь будет карточка профиля -->
          <!-- Место зарезервировано для динамической вставки элементов через скрипт -->
        </div>
        <!-- Конец контейнера карточки профиля -->
      </section>
      <!-- Конец секции профиля -->
      <!-- Репозитории -->
      <!-- Комментарий в коде: блок для вывода списка проектов пользователя -->
      <section id="repos-section" class="section hidden">
        <!-- Секция репозиториев; скрыта по умолчанию -->
        <h2>Последние репозитории</h2>
        <!-- Заголовок второго уровня для списка проектов -->
        <ul id="repos" class="repo-list">
          <!-- Маркированный список, куда JS добавит элементы li со ссылками на репозитории -->
          <!-- Здесь будут репозитории -->
          <!-- Место для динамического наполнения списком из API -->
        </ul>
        <!-- Конец списка репозиториев -->
      </section>
      <!-- Конец секции репозиториев -->
      <!-- История поиска -->
      <!-- Комментарий в коде: блок для хранения предыдущих запросов -->
      <section id="history-section" class="section hidden">
        <!-- Секция истории; скрыта, если в localStorage нет данных -->
        <h2>История поиска</h2>
        <!-- Заголовок блока истории запросов -->
        <div id="history" class="history-tags">
          <!-- Контейнер для кнопок-тегов с именами ранее найденных пользователей -->
          <!-- Здесь будут теги истории -->
          <!-- Сюда JS будет вставлять кнопки последних 3-х запросов -->
        </div>
        <!-- Конец блока с тегами -->
        <button id="clearHistory" class="btn-clear">Очистить историю</button>
        <!-- Кнопка для полного удаления истории поиска из памяти браузера -->
      </section>
      <!-- Конец секции истории -->
    </main>
    <!-- Закрытие основного блока контента -->
    <footer class="footer">
      <!-- Подвал сайта: содержит информацию о копирайте и курсе -->
      <p>© 2026 Курс Frontend-разработки</p>
      <!-- Текст с указанием года и названия обучающего курса -->
    </footer>
    <!-- Закрытие подвала -->
    <script src="script.js"></script>
    <!-- Подключение файла с логикой на JavaScript; стоит в конце для быстрой загрузки HTML -->
  </body>
  <!-- Закрытие тела документа -->
</html>
<!-- Конец HTML-документа -->
