<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Spy — PR-08</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <h1>GitHub Spy</h1>
        <p>Практическая работа №8: Fetch & API</p>
    </header>

    <main class="container">
        <section class="search-section section">
            <form id="search-form">
                <div class="input-group">
                    <input type="text" id="username" placeholder="Введите GitHub username" maxlength="39" autocomplete="off">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>
                <button type="submit" id="searchBtn">Найти</button>
            </form>
            <div id="loader" class="loader hidden">Загрузка данных...</div>
            <div id="error" class="error hidden"></div>
        </section>

        <section id="profile-section" class="section hidden">
            <div id="profile"></div>
        </section>

        <section id="repos-section" class="section hidden">
            <h2>Последние репозитории</h2>
            <ul id="repos" class="repo-list"></ul>
            <div id="pagination" class="pagination"></div>
        </section>

        <section id="history-section" class="section hidden">
            <h3>История поиска</h3>
            <div id="history" class="history-tags"></div>
            <button id="clearHistory" class="btn-clear">Очистить историю</button>
        </section>
    </main>

    <footer class="app-footer">
        <p>GitHub Spy © 2026 — Учебный проект по JavaScript</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
